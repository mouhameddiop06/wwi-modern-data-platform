# Connexion Snowflake : valeurs lues depuis les variables d'environnement (.env)
wwi_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'WWI_ENGINEER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WWI_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'WWI_DB') }}"
      schema: SILVER
      threads: 8
      client_session_keep_alive: false
