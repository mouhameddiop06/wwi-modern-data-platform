name: wwi_dbt
version: "1.0.0"
config-version: 2
profile: wwi_dbt

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Plage du calendrier (données WWI : 2013-01-01 -> 2016-05-31)
  date_start: "2013-01-01"
  date_end: "2016-12-31"

models:
  wwi_dbt:
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table
      +grants:
        select: ["WWI_ANALYST"]
